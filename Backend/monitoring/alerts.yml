groups:
  - name: expocraft-backend
    rules:
      - alert: ExpoCraftHighErrorCount
        expr: increase(expocraft_http_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ExpoCraft backend has elevated HTTP errors
      - alert: ExpoCraftJobFailures
        expr: increase(expocraft_job_failures_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: ExpoCraft background job failed
      - alert: ExpoCraftBackendDown
        expr: up{job="expocraft-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: ExpoCraft backend is down
      - alert: ExpoCraftQueueSlaCritical
        expr: expocraft_admin_sla_critical_total > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Admin queue has critical SLA breaches
      - alert: ExpoCraftRedisMissingInProduction
        expr: expocraft_runtime_store_info{provider!="redis",environment="production"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Production runtime store is not Redis-backed
      - alert: ExpoCraftBackupStale
        expr: time() - expocraft_last_backup_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL backup is older than 26 hours
